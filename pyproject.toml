[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-probing"
version = "0.1.0"
description = "A library for counterfactual probing of language models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [
    {name = "James"}
]
dependencies = [
    "tqdm>=4.65.0,<5.0",
    "vllm>=0.6.0,<0.9.0",
    "nnsight>=0.3.0,<0.4.0",
    "transformers>=4.40.0,<5.0.0",
    "torch>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-xdist>=3.0,<4.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "pre-commit>=3.0,<4.0",
]
analysis = [
    "matplotlib>=3.8.0,<4.0",
    "scipy>=1.12.0,<2.0",
    "scikit-learn>=1.4.0,<2.0",
    "plotly>=5.18.0,<6.0",
    "seaborn>=0.13.0,<1.0",
    "ipykernel>=6.0,<7.0",
    "nbformat>=5.0,<6.0",
]

[project.scripts]
cfprobe = "counterfactual_probing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require model download)",
    "slow: marks tests as slow running",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/counterfactual_probing"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
