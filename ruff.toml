# Ruff configuration for counterfactual-probing

# Target Python 3.10+
target-version = "py310"

# Line length
line-length = 100

# Exclude
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    # Legacy code (to be removed)
    "src/rollouts",
    "src/utils/api_client.py",
]

[lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]

# Ignore these rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
    "SIM108", # Use ternary operator (sometimes less readable)
]

# Allow these to be fixed automatically
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
# Tests can use assert and have longer lines
"tests/*" = ["S101", "E501"]
# Scripts can have print statements
"scripts/*" = ["T201"]

[lint.isort]
known-first-party = ["counterfactual_probing"]
force-single-line = false
lines-after-imports = 2

[format]
# Use double quotes
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Unix line endings
line-ending = "lf"

# Enable auto-detection of magic trailing comma
skip-magic-trailing-comma = false

# Format docstrings
docstring-code-format = true
